name: Publish to pub.dev

on:
  push:
    tags:
      - "smf_hooks-v[0-9]+.[0-9]+.[0-9]+"
      - "smf_engine-v[0-9]+.[0-9]+.[0-9]+"
      - "smf_cli-v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

concurrency:
  group: pub.dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-hooks:
    name: Publish smf_hooks
    if: startsWith(github.ref_name, 'smf_hooks-v')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
    with:
      environment: pub.dev
      working-directory: packages/smf_hooks

  publish-engine:
    name: Publish smf_engine
    if: startsWith(github.ref_name, 'smf_engine-v')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
    with:
      environment: pub.dev
      working-directory: packages/smf_engine

  publish-cli:
    name: Publish smf_cli
    if: startsWith(github.ref_name, 'smf_cli-v')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
    with:
      environment: pub.dev
      working-directory: packages/smf_cli
